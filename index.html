<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Državni ispit – vježbaonica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* v2: zamjenjuje staru verziju kviza */
/* Layout: jedan stupac poput službenog spisa – zaglavlje s oznakom, list s pitanjem, žig s ocjenom */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#18213a; --muted:#5d6782; --line:#d4dae6;
  --accent:#1f4aa8; --accent-soft:#e3eafa; --ok:#16794a; --ok-soft:#e1f3e9; --bad:#b3261e; --bad-soft:#fbe5e3; --warn:#9a6400; --warn-soft:#fbf0d9;
  --f-display:"Bitter",Georgia,serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--paper:#171e2e;--ink:#e6eaf3;--muted:#98a2bb;--line:#2b3550;--accent:#86a8ff;--accent-soft:#1d2a4a;--ok:#5fd394;--ok-soft:#123222;--bad:#ff8f86;--bad-soft:#3a1715;--warn:#f0bf5a;--warn-soft:#3a2c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--paper:#171e2e;--ink:#e6eaf3;--muted:#98a2bb;--line:#2b3550;--accent:#86a8ff;--accent-soft:#1d2a4a;--ok:#5fd394;--ok-soft:#123222;--bad:#ff8f86;--bad-soft:#3a1715;--warn:#f0bf5a;--warn-soft:#3a2c10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem;font-weight:800}h2{font-size:1.25rem}h3{font-size:1.05rem}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:600 .9rem var(--f-body);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-within,select:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.mode b{font-family:var(--f-display);font-size:1.05rem}.mode span{color:var(--muted);font-size:.9rem}
.mode.main{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cycle{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cycle div{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 1.1rem var(--f-display);color:var(--muted);max-width:100%}
.cycle div.g5,.cycle div.g4{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cycle div.g3{border-style:solid;border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.cycle div.g2,.cycle div.g1{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:8px}
.qtext{font-size:1.08rem;font-weight:600}
.hint{font-size:.85rem;color:var(--accent);font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.pair:last-child{border-bottom:0}
select{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
select.ok{border-color:var(--ok);background:var(--ok-soft)}select.bad{border-color:var(--bad);background:var(--bad-soft)}
.fill{line-height:2.4}.fill select{width:auto;display:inline-block;margin-inline:2px;padding:4px 6px}
.ord{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ord .n{font:700 .9rem var(--f-mono);color:var(--muted);width:1.5em}
.ord .t{flex:1;min-width:0}
.ord button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer}
.ord.ok{border-color:var(--ok);background:var(--ok-soft)}.ord.bad{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.95rem}
.verdict{font:800 1rem var(--f-display)}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.part{color:var(--warn)}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid30 button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:6px;padding:5px 0;font:600 .78rem var(--f-mono);cursor:pointer}
.grid30 button.d{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.grid30 button.c{outline:2px solid var(--ink)}
.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--sc);color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);margin:6px auto;font-family:var(--f-display)}
.stamp .g{font-size:3.2rem;font-weight:800;line-height:1}.stamp .l{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:6px 10px;font-size:.85rem;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chip small{font-family:var(--f-mono);opacity:.75}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;font-size:.92rem}
.pill{display:inline-block;font:600 .72rem var(--f-mono);border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted)}
.big{font:800 2.4rem var(--f-display)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

-8"},{"t":"T","k":"Hrvatski sabor","e":"To su jedini ustavni razlozi za produženje mandata.","q":"Mandat Sabora može se zakonom produžiti samo u slučaju rata, ratnog stanja, neposredne ugroženosti neovisnosti i jedinstvenosti države te velikih prirodnih nepogoda.","a":true,"id":"q1-9","g":"q1-9"},{"t":"M","k":"Hrvatski sabor","e":"Iznimka: zatečen u djelu s kaznom zatvora duljom od 5 godina može se pritvoriti bez odobrenja.","q":"Označite točne tvrdnje o imunitetu saborskih zastupnika.","o":["Imunitet traje od dana konstituiranja Sabora do prestanka mandata","Zastupnik ne može odgovarati za izraženo mišljenje ili glasovanje u Saboru","Bez odobrenja Sabora ne može se pokrenuti kazneni postupak protiv zastupnika","Imunitet traje i četiri godine nakon prestanka mandata","Zastupnik ne može biti pritvoren ni kad je zatečen u teškom kaznenom djelu"],"c":[0,1,2],"id":"q1-10","g":"q1-10"},{"t":"F","k":"Hrvatski sabor","e":"Pravilo imuniteta: iznimka iznad 5 godina zatvora, izvješćuje se predsjednik Sabora.","q":"Zastupnik može biti pritvoren bez odobrenja Sabora ako je zatečen u kaznenom djelu za koje je propisana kazna zatvora dulja od {} godina, o čemu se izvješćuje {}.","b":[["pet","tri","deset"],["predsjednik Sabora","predsjednik Vlade","Ustavni sud"]],"id":"q1-11","g":"q1-11"},{"t":"S","k":"Hrvatski sabor","e":"Mandatno-imunitetno povjerenstvo o tome raspravlja čak i kad Sabor ne zasjeda.","q":"Tko raspravlja o pokretanju kaznenog postupka protiv zastupnika kad Sabor ne zasjeda?","o":["Mandatno-imunitetno povjerenstvo","Predsjednik Sabora sam","Ustavni sud","Odbor za Ustav, Poslovnik i politički sustav"],"c":[0],"id":"q1-12","g":"q1-12"},{"t":"S","k":"Hrvatski sabor","e":"Interpelaciju podnosi najmanje 1/10 zastupnika; povjerenje Vladi pokreće 1/5.","q":"Koliki dio zastupnika može podnijeti interpelaciju o radu Vlade?","o":["Najmanje jedna desetina","Najmanje jedna petina","Najmanje jedna trećina","Većina svih zastupnika"],"c":[0],"id":"q1-13","g":"q1-13"},{"t":"F","k":"Hrvatski sabor","e":"Dva redovna zasjedanja godišnje.","q":"Sabor redovno zasjeda od {} do 15. srpnja i od {} do 15. prosinca.","b":[["15. siječnja","1. siječnja","15. veljače"],["15. rujna","1. rujna","15. listopada"]],"id":"q1-14","g":"q1-14"},{"t":"M","k":"Hrvatski sabor","e":"Izvanredno zasjedanje traže Predsjednik RH, predsjednik Vlade ili većina zastupnika; sazvati ga može i predsjednik Sabora uz mišljenje klubova.","q":"Tko može zatražiti izvanredno zasjedanje Sabora?","o":["Predsjednik Republike","Predsjednik Vlade","Većina zastupnika","Ustavni sud","Jedna desetina zastupnika"],"c":[0,1,2],"id":"q1-15","g":"q1-15"},{"t":"S","k":"Hrvatski sabor","e":"Opće pravilo: obična većina uz kvorum većine zastupnika.","q":"Kako Sabor donosi odluke ako Ustavom nije drukčije određeno?","o":["Većinom glasova, ako je nazočna većina zastupnika","Većinom glasova svih zastupnika","Dvotrećinskom većinom nazočnih","Jednoglasno"],"c":[0],"id":"q1-16","g":"q1-16"},{"t":"P","k":"Hrvatski sabor","e":"Samo manjinska prava traže 2/3; ostali organski zakoni i proračun traže većinu svih.","q":"Spojite vrstu zakona s potrebnom većinom u Saboru.","p":[["Zakon o pravima nacionalnih manjina","dvotrećinska većina svih zastupnika"],["Zakon o izbornom sustavu","većina svih zastupnika"],["Državni proračun","većina svih zastupnika"],["Obična odluka","većina nazočnih uz kvorum"]],"id":"q1-17","g":"q1-17"},{"t":"S","k":"Hrvatski sabor","e":"Prava manjina jedini su organski zakon koji traži 2/3 svih zastupnika.","q":"Kojom većinom Sabor donosi zakon kojim se uređuju prava nacionalnih manjina?","o":["Dvotrećinskom većinom glasova svih zastupnika","Većinom glasova svih zastupnika","Većinom nazočnih zastupnika","Tropetinskom većinom"],"c":[0],"id":"q1-18","g":"q1-18"},{"t":"S","k":"Hrvatski sabor","e":"Proračun traži apsolutnu većinu – većinu svih zastupnika.","q":"Kojom većinom se donosi državni proračun?","o":["Većinom glasova svih zastupnika","Dvotrećinskom većinom","Većinom nazočnih","Jednoglasn let S=blank();try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const idx=n=>[...Array(n).keys()];
let view='home',L=null,R=null,study={q:'',k:'',p:0},confirmReset=false;

/* ---------- pitanja: priprema, bodovanje, prikaz ---------- */
function prep(q){
  if(q.t==='S'||q.t==='M')return{o:shuf(idx(q.o.length))};
  if(q.t==='P')return{r:shuf(idx(q.p.length))};
  if(q.t==='R'){let o;do{o=shuf(idx(q.i.length))}while(o.every((v,i)=>v===i));return{o};}
  if(q.t==='F')return{b:q.b.map(g=>shuf(idx(g.length)))};
  return{};
}
function initAns(q,o){if(q.t==='M')return[];if(q.t==='P')return q.p.map(()=>-1);if(q.t==='R')return o.o.slice();if(q.t==='F')return q.b.map(()=>-1);return null}
function answered(q,a){if(a==null)return false;if(q.t==='M')return a.length>0;if(q.t==='P'||q.t==='F')return a.some(x=>x>=0);return true}
function score(q,a){
  if(a==null)return 0;
  if(q.t==='S')return a===q.c[0]?1:0;
  if(q.t==='T')return a===q.a?1:0;
  if(q.t==='M'){const h=a.filter(x=>q.c.includes(x)).length,w=a.length-h;return Math.max(0,(h-w)/q.c.length)}
  if(q.t==='P')return a.filter((v,i)=>v===i).length/q.p.length;
  if(q.t==='R')return a.filter((v,i)=>v===i).length/q.i.length;
  if(q.t==='F')return a.filter(v=>v===0).length/q.b.length;
  return 0;
}
function qView(q,o,a,rev,h){ // h = ime handler objekta
  let x='';const dis=rev?'disabled':'';
  if(q.t==='S'||q.t==='M'){
    const m=q.t==='M';
    x=o.o.map(i=>{const s=m?a.includes(i):a===i,c=q.c.includes(i);
      let cl=rev?(c&&s?'ok':s?'bad':c?'miss':''):(s?'sel':'');
      return `<label class="opt ${cl}"><input type="${m?'checkbox':'radio'}" name="a" ${s?'checked':''} ${dis} onchange="${h}.pick(${i})"><span>${esc(q.o[i])}${rev&&c&&!s?' <span class="pill">točan odgovor</span>':''}</span></label>`}).join('');
  }else if(q.t==='T'){
    x='<div class="tf">'+[[true,'Točno'],[false,'Netočno']].map(([v,t])=>{const s=a===v;let cl=rev?(v===q.a?(s?'ok':'miss'):(s?'bad':'')):(s?'sel':'');
      return `<label class="opt ${cl}"><input type="radio" name="a" ${s?'checked':''} ${dis} onchange="${h}.pick(${v})">${t}</label>`}).join('')+'</div>';
  }else if(q.t==='P'){
    x=q.p.map((p,i)=>{const cl=rev?(a[i]===i?'ok':'bad'):'';
      return `<div class="pair"><div>${esc(p[0])}</div><div><select id="p${i}" class="${cl}" ${dis} onchange="${h}.pair(${i},+this.value)"><option value="-1">— odaberi —</option>${o.r.map(j=>`<option value="${j}" ${a[i]===j?'selected':''}>${esc(q.p[j][1])}</option>`).join('')}</select>${rev&&a[i]!==i?`<div class="muted" style="font-size:.85rem">Točno: ${esc(p[1])}</div>`:''}</div></div>`}).join('');
  }else if(q.t==='R'){
    x=a.map((v,k)=>{const cl=rev?(v===k?'ok':'bad'):'';
      return `<div class="ord ${cl}"><span class="n">${k+1}.</span><span class="t">${esc(q.i[v])}</span>${rev?'':`<button aria-label="Gore" onclick="${h}.mv(${k},-1)" ${k===0?'disabled':''}>↑</button><button aria-label="Dolje" onclick="${h}.mv(${k},1)" ${k===a.length-1?'disabled':''}>↓</button>`}</div>`}).join('');
    if(rev&&score(q,a)<1)x+=`<div class="muted" style="font-size:.9rem">Točan redoslijed: ${q.i.map(esc).join(' → ')}</div>`;
  }else if(q.t==='F'){
    let g=0;x='<div class="fill">'+esc(q.q).split('{}').map((part,k,arr)=>{if(k===arr.length-1)return part;const i=g++;const cl=rev?(a[i]===0?'ok':'bad'):'';
      return part+`<select id="f${i}" class="${cl}" ${dis} onchange="${h}.gap(${i},+this.value)"><option value="-1">…</option>${o.b[i].map(j=>`<option value="${j}" ${a[i]===j?'selected':''}>${esc(q.b[i][j])}</option>`).join('')}</select>`}).join('')+'</div>';
    if(rev&&score(q,a)<1)x+=`<div class="muted" style="font-size:.9rem">Točno: ${q.b.map(b=>esc(b[0])).join(' · ')}</div>`;
  }
  const stem=q.t==='F'?'Dopunite rečenicu:':q.t==='T'?esc(q.q):esc(q.q);
  return `<div class="qtext">${stem}</div><div class="hint">${TYPE[q.t]}</div>${x}`;
}
function handler(getQ,getO,getA,setA,done){
  return{pick(v){if(done())return;const q=getQ();if(q.t==='M'){let a=getA();a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);setA(a)}else setA(v);render()},
    pair(i,v){const a=getA().slice();a[i]=v;setA(a);render()},
    gap(i,v){const a=getA().slice();a[i]=v;setA(a);render()},
    mv(k,d){const a=getA().slice();[a[k],a[k+d]]=[a[k+d],a[k]];a.touched=true;setA(a);render()}};
}
function verdict(sc){return sc>=1?'<span class="verdict ok">Točno – 1 bod</span>':sc>0?`<span class="verdict part">Djelomično – ${sc.toFixed(2).replace('.',',')} boda</span>`:'<span class="verdict bad">Netočno – 0 bodova</span>'}
function stat(id,sc){const s=S.st[id]||(S.st[id]={n:0,p:0});s.n++;s.p+=sc;
  if(sc<1)S.mist[id]=0;else if(id in S.mist){S.mist[id]++;if(S.mist[id]>=2)delete S.mist[id]}}

/* ---------- početna ---------- */
function cyc(){const h=S.hist,sum=h.reduce((a,x)=>a+x.g,0);return{n:h.length,sum,avg:h.length?sum/h.length:0,need:Math.ceil(AVG*NEED),max:sum+5*(NEED-h.length)}}
function topicStats(){const t={};BANK.forEach(q=>{const o=t[q.k]||(t[q.k]={n:0,seen:0,p:0,c:0});o.n++;const s=S.st[q.id];if(s){o.seen++;o.p+=s.p;o.c+=s.n}});return t}
function home(){
  const c=cyc(),free=Object.keys(GROUPS).filter(g=>!S.used.includes(g)).length,mist=Object.keys(S.mist).length;
  const dead=c.n>0&&c.max<c.need;
  return `<div class="sheet"><div class="mono">Ciklus ${S.cycles.length+1} · kviz ${Math.min(c.n+1,NEED)} od ${NEED}</div>
  <h1>Prosjek ${c.n?c.avg.toFixed(2).replace('.',','):'–'} <span class="muted" style="font-size:1rem;font-weight:500">/ potrebno ${AVG.toString().replace('.',',')}</span></h1>
  <div class="cycle">${idx(NEED).map(i=>{const h=S.hist[i];return `<div class="${h?'g'+h.g:''}" title="${h?h.s.toFixed(1)+' bodova':''}">${h?h.g:''}</div>`}).join('')}</div>
  <div class="muted" style="font-size:.92rem">${dead?`<b style="color:var(--bad)">Prosjek ${AVG.toString().replace('.',',')} više nije dostižan.</b> Završi ciklus ili ga resetiraj u postavkama.`:`Za prolaz treba zbroj ocjena najmanje ${c.need}. Sada imaš ${c.sum}, a najviše možeš doći do ${c.max}.`}</div></div>
  <div class="modes">
   <button class="mode main" onclick="startExam()"><b>Ispit · 30 pitanja</b><span>Ocjena 1–5 ulazi u prosjek. Objašnjenja dobivaš na kraju. Neiskorištenih skupina pitanja: ${free}.</span></button>
   <button class="mode" onclick="go('learn')"><b>Učenje</b><span>Odmah vidiš točan odgovor i objašnjenje. Biraš teme. Ne ulazi u ocjenu.</span></button>
   <button class="mode" onclick="startLearn('mist')" ${mist?'':'disabled'}><b>Moje greške · ${mist}</b><span>Pitanja na kojima si pogriješio. Pitanje nestaje nakon dva točna odgovora zaredom.</span></button>
  </div>
  <div class="sheet"><h3>Kako se boduje</h3><div class="muted" style="font-size:.93rem">Svako pitanje nosi 1 bod. Kod pitanja s više točnih odgovora dobivaš razmjeran dio: svaki točno označen odgovor donosi dio boda, a svaki krivo označen jednom toliko oduzima (ne ispod nule). Kod spajanja, redoslijeda i dopunjavanja svaki točan dio donosi svoj udio boda. Ocjene: 27–30 = 5, 24–26,99 = 4, 21–23,99 = 3, 18–20,99 = 2, ispod 18 = 1. Nakon 10 kvizova prosjek mora biti najmanje 4,75, inače se ciklus poništava.</div></div>`;
}

/* ---------- ispit ---------- */
function startExam(){
  if(S.cur){view='exam';render();return}
  let free=Object.keys(GROUPS).filter(g=>!S.used.includes(g));
  if(free.length<N){S.used=[];free=Object.keys(GROUPS)}
  const per={},pick=[];
  for(const g of shuf(free)){const ids=GROUPS[g].filter(id=>!S.bad.includes(id));if(!ids.length)continue;
    const orig=ids.find(id=>id===g),id=orig&&Math.random()<.75?orig:ids[Math.random()*ids.length|0],k=BYID[id].k;
    if((per[k]||0)>=2)continue;per[k]=(per[k]||0)+1;pick.push(id);if(pick.length===N)break}
  const o={},a={};pick.forEach(id=>{const q=BYID[id];o[id]=prep(q);a[id]=initAns(q,o[id])});
  S.cur={ids:pick,o,a,i:0};save();view='exam';render();
}
const X={pick(){},pair(){},gap(){},mv(){}};
const EX=handler(()=>BYID[S.cur.ids[S.cur.i]],()=>S.cur.o[S.cur.ids[S.cur.i]],()=>S.cur.a[S.cur.ids[S.cur.i]],v=>{S.cur.a[S.cur.ids[S.cur.i]]=v;save()},()=>false);
function exam(){
  const c=S.cur,id=c.ids[c.i],q=BYID[id],done=c.ids.filter(i=>answered(BYID[i],c.a[i])).length;
  return `<div class="sheet"><div class="qhead"><span class="mono">Pitanje ${String(c.i+1).padStart(2,'0')}/${N} · ${esc(q.k)}</span><span class="mono">Odgovoreno ${done}/${N}</span></div>
  <div class="bar"><i style="width:${done/N*100}%"></i></div>${qView(q,c.o[id],c.a[id],false,'EX')}
  <div class="row"><button class="btn" onclick="exMv(-1)" ${c.i?'':'disabled'}>← Natrag</button><button class="btn" onclick="exMv(1)" ${c.i<N-1?'':'disabled'}>Dalje →</button><span class="grow"></span><button class="btn p" onclick="finishExam()">Predaj ispit</button></div>
  <div class="grid30">${c.ids.map((x,k)=>`<button class="${answered(BYID[x],c.a[x])?'d':''} ${k===c.i?'c':''}" onclick="exJump(${k})">${k+1}</button>`).join('')}</div>
  ${c.warn?`<div class="confirm"><b>Neodgovorenih pitanja: ${c.warn}.</b><span>Neodgovoreno pitanje nosi 0 bodova.</span><div class="row"><button class="btn" onclick="S.cur.warn=0;render()">Vrati se</button><button class="btn p" onclick="finishExam(true)">Svejedno predaj</button></div></div>`:''}</div>`;
}
function exMv(d){S.cur.i+=d;S.cur.warn=0;save();render()}
function exJump(k){S.cur.i=k;S.cur.warn=0;save();render()}
function finishExam(force){
  const c=S.cur,un=c.ids.filter(i=>!answered(BYID[i],c.a[i])).length;
  if(un&&!force){c.warn=un;render();return}
  let pts=0;const det=c.ids.map(id=>{const sc=score(BYID[id],c.a[id]);pts+=sc;stat(id,sc);return{id,sc}});
  pts=Math.round(pts*100)/100;const g=grade(pts);
  c.ids.forEach(id=>{const gr=BYID[id].g;if(!S.used.includes(gr))S.used.push(gr)});
  S.hist.push({s:pts,g,t:Date.now()});
  R={pts,g,det,o:c.o,a:c.a};S.cur=null;save();view='res';render();
}
function result(){
  const c=cyc(),col=R.g>=4?'var(--ok)':R.g===3?'var(--warn)':'var(--bad)';
  let end='';
  if(c.n>=NEED){const ok=c.avg>=AVG-1e-9;end=`<div class="sheet" style="border-color:${ok?'var(--ok)':'var(--bad)'}"><h2 style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Ciklus položen':'Ciklus nije položen'}</h2><div>Prosjek nakon ${NEED} kvizova: <b>${c.avg.toFixed(2).replace('.',',')}</b>. ${ok?'Spreman si za državni ispit.':'Ocjene se poništavaju i kreće novi ciklus. Pitanja se i dalje ne ponavljaju dok ne potrošiš bazu.'}</div><div><button class="btn p" onclick="endCycle(${ok})">${ok?'Zatvori ciklus':'Kreni ispočetka'}</button></div></div>`}
  const wrong=R.det.filter(d=>d.sc<1).length;
  return `<div class="sheet" style="align-items:center;text-align:center"><div class="mono">Rješenje o ocjeni · kviz ${c.n} od ${NEED}</div>
  <div class="stamp" style="--sc:${col}"><span class="g">${R.g}</span><span class="l">${GL[R.g]}</span></div>
  <div class="big">${R.pts.toFixed(2).replace('.',',')} <span class="muted" style="font-size:1.2rem">/ 30</span></div>
  <div class="muted">Prosjek ciklusa: ${c.avg.toFixed(2).replace('.',',')} · za ponavljanje: ${wrong} pitanja</div>
  <div class="row" style="justify-content:center"><button class="btn p" onclick="go('home')">Na početnu</button>${wrong?`<button class="btn" onclick="startLearn('mist')">Uvježbaj greške</button>`:''}</div></div>${end}
  <h2>Pregled s objašnjenjima</h2>
  ${R.det.map((d,k)=>{const q=BYID[d.id];return `<div class="sheet"><div class="qhead"><span class="mono">${k+1}. · ${esc(q.k)}</span>${verdict(d.sc)}</div>${qView(q,R.o[d.id],R.a[d.id],true,'X')}<div class="expl">${esc(q.e)}</div><div><button class="btn" style="font-size:.85rem;padding:6px 10px" onclick="flag('${d.id}',this)">Prijavi kao loše pitanje</button></div></div>`}).join('')}`;
}
function endCycle(ok){S.cycles.push({avg:cyc().avg,ok,t:Date.now()});S.hist=[];save();go('home')}
function flag(id,b){if(!S.bad.includes(id))S.bad.push(id);save();b.textContent='Izbačeno iz baze';b.disabled=true}

/* ---------- učenje ---------- */
let pickTopics=[];
function learnHome(){
  const t=topicStats(),keys=Object.keys(t);
  return `<div class="sheet"><h2>Učenje</h2><div class="muted">Odaberi teme (ili ništa za sve). Nakon svakog odgovora vidiš objašnjenje. Sesija ima 15 pitanja.</div>
  <div class="chips">${keys.map(k=>{const o=t[k],pct=o.c?Math.round(o.p/o.c*100):null;return `<button class="chip ${pickTopics.includes(k)?'on':''}" onclick="togT('${esc(k).replace(/'/g,"\\'")}')">${esc(k)} <small>${pct==null?o.n:pct+'%'}</small></button>`}).join('')}</div>
  <div class="row"><button class="btn p" onclick="startLearn('topics')">Kreni (${pickTopics.length?pickTopics.length+' tema':'sve teme'})</button><button class="btn" onclick="startLearn('weak')">Najslabije teme</button><button class="btn" onclick="startLearn('new')">Još neviđena pitanja</button></div></div>
  <div class="sheet"><h3>Napredak po temama</h3>${keys.map(k=>{const o=t[k],pct=o.c?Math.round(o.p/o.c*100):0;return `<div class="topic"><span>${esc(k)} <span class="muted">· ${o.seen}/${o.n}</span></span><div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)'}"></i></div><span class="mono">${o.c?pct+'%':'–'}</span></div>`}).join('')}</div>`;
}
function togT(k){pickTopics=pickTopics.includes(k)?pickTopics.filter(x=>x!==k):pickTopics.concat(k);render()}
function startLearn(mode){
  let pool=BANK.filter(q=>!S.bad.includes(q.id));
  if(mode==='mist')pool=pool.filter(q=>q.id in S.mist);
  else if(mode==='topics'&&pickTopics.length)pool=pool.filter(q=>pickTopics.includes(q.k));
  else if(mode==='new')pool=pool.filter(q=>!S.st[q.id]);
  else if(mode==='weak'){const t=topicStats();const ks=Object.keys(t).sort((a,b)=>{const pa=t[a].c?t[a].p/t[a].c:.5,pb=t[b].c?t[b].p/t[b].c:.5;return pa-pb}).slice(0,4);pool=pool.filter(q=>ks.includes(q.k))}
  if(!pool.length){pool=BANK}
  const ids=shuf(pool).slice(0,mode==='mist'?Math.min(20,pool.length):15).map(q=>q.id),o={},a={};
  ids.forEach(id=>{o[id]=prep(BYID[id]);a[id]=initAns(BYID[id],o[id])});
  L={ids,o,a,i:0,chk:false,pts:0,streak:0,best:0,mode};view='learnQ';render();
}
const LH=handler(()=>BYID[L.ids[L.i]],()=>L.o[L.ids[L.i]],()=>L.a[L.ids[L.i]],v=>{L.a[L.ids[L.i]]=v},()=>L.chk);
function learnQ(){
  const id=L.ids[L.i],q=BYID[id];
  if(L.i>=L.ids.length)return'';
  const sc=L.chk?score(q,L.a[id]):0;
  return `<div class="sheet"><div class="qhead"><span class="mono">${L.mode==='mist'?'Greške':'Učenje'} · ${L.i+1}/${L.ids.length} · ${esc(q.k)}</span><span class="mono">Niz točnih: ${L.streak}</span></div>
  <div class="bar"><i style="width:${L.i/L.ids.length*100}%"></i></div>
  ${qView(q,L.o[id],L.a[id],L.chk,'LH')}
  ${L.chk?`<div>${verdict(sc)}</div><div class="expl">${esc(q.e)}</div>`:''}
  <div class="row"><button class="btn" onclick="go('learn')">Prekini</button><span class="grow"></span>${L.chk?`<button class="btn p" onclick="lNext()">${L.i<L.ids.length-1?'Sljedeće pitanje →':'Završi sesiju'}</button>`:`<button class="btn p" onclick="lCheck()" ${answered(q,L.a[id])?'':'disabled'}>Provjeri</button>`}</div></div>`;
}
function lCheck(){const id=L.ids[L.i],sc=score(BYID[id],L.a[id]);L.chk=true;L.pts+=sc;if(sc>=1){L.streak++;L.best=Math.max(L.best,L.streak)}else L.streak=0;stat(id,sc);save();render()}
function lNext(){L.chk=false;L.i++;if(L.i>=L.ids.length){view='learnEnd'}render()}
function learnEnd(){const pct=Math.round(L.pts/L.ids.length*100);return `<div class="sheet" style="text-align:center;align-items:center"><div class="mono">Sesija završena</div><div class="big">${pct}%</div><div class="muted">${L.pts.toFixed(1).replace('.',',')} od ${L.ids.length} bodova · najdulji niz točnih: ${L.best} · u greškama čeka: ${Object.keys(S.mist).length}</div><div class="row" style="justify-content:center"><button class="btn p" onclick="startLearn('${L.mode}')">Nova sesija</button><button class="btn" onclick="go('home')">Na početnu</button></div></div>`}

/* ---------- baza i postavke ---------- */
function base(){
  const t=study.q.toLowerCase(),ks=[...new Set(BANK.map(q=>q.k))];
  const list=BANK.filter(q=>q.id===q.g&&(!study.k||q.k===study.k)&&(!t||JSON.stringify([q.q,q.o,q.p,q.i,q.b,q.e]).toLowerCase().includes(t)));
  const P=20,pages=Math.max(1,Math.ceil(list.length/P));if(study.p>=pages)study.p=0;
  const ans=q=>q.t==='S'||q.t==='M'?q.c.map(i=>'✔ '+esc(q.o[i])).join('<br>'):q.t==='T'?(q.a?'✔ Točno':'✘ Netočno'):q.t==='P'?q.p.map(p=>esc(p[0])+' → <b>'+esc(p[1])+'</b>').join('<br>'):q.t==='R'?q.i.map(esc).join(' → '):q.b.map(b=>'<b>'+esc(b[0])+'</b>').join(' · ');
  return `<div class="sheet"><h2>Baza pitanja · ${list.length}</h2><input id="sq" type="search" placeholder="Pretraži pojam, npr. pučki pravobranitelj" value="${esc(study.q)}" style="font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)" oninput="study.q=this.value;study.p=0;clearTimeout(window._t);window._t=setTimeout(()=>{render();const e=document.getElementById('sq');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)">
  <div class="row"><select id="sk" style="flex:1;min-width:0" onchange="study.k=this.value;study.p=0;render()"><option value="">Sve teme</option>${ks.map(k=>`<option ${k===study.k?'selected':''}>${esc(k)}</option>`).join('')}</select><button class="btn" onclick="study.p=Math.max(0,study.p-1);render()">←</button><span class="mono">${study.p+1}/${pages}</span><button class="btn" onclick="study.p=Math.min(${pages-1},study.p+1);render()">→</button></div></div>
  ${list.slice(study.p*P,study.p*P+P).map(q=>`<div class="sheet"><div class="mono">${esc(q.k)} · ${TYPE[q.t]}</div><div class="qtext">${q.t==='F'?esc(q.q).replace(/\{\}/g,'_____'):esc(q.q)}</div><div>${ans(q)}</div><div class="expl">${esc(q.e)}</div></div>`).join('')}`;
}
function settings(){
  return `<div class="sheet"><h2>Postavke</h2><div class="muted">Napredak se sprema samo u ovom pregledniku.</div>
  <table><tr><td>Odrađenih ciklusa</td><td>${S.cycles.length} (položenih ${S.cycles.filter(c=>c.ok).length})</td></tr><tr><td>Iskorištenih skupina pitanja</td><td>${S.used.length} od ${Object.keys(GROUPS).length}</td></tr><tr><td>Izbačenih pitanja</td><td>${S.bad.length}</td></tr></table>
  ${S.cycles.length?`<h3>Prošli ciklusi</h3><table>${S.cycles.map((c,i)=>`<tr><td>${i+1}.</td><td>${new Date(c.t).toLocaleDateString('hr-HR')}</td><td>prosjek ${c.avg.toFixed(2).replace('.',',')}</td><td style="color:${c.ok?'var(--ok)':'var(--bad)'}">${c.ok?'položen':'poništen'}</td></tr>`).join('')}</table>`:''}
  <h3>Sigurnosna kopija</h3><div class="muted" style="font-size:.92rem">Spremi napredak u datoteku i učitaj ga na drugom uređaju ili pregledniku.</div><div class="row"><button class="btn" onclick="exportS()">Spremi napredak u datoteku</button><label class="btn" for="impf">Učitaj napredak iz datoteke</label><input id="impf" type="file" accept=".json,application/json" hidden onchange="importS(this.files[0])"></div><div id="impmsg" class="muted"></div><div class="row"><button class="btn" onclick="S.bad=[];save();render()">Vrati izbačena pitanja</button><button class="btn" onclick="confirmReset=true;render()">Obriši sav napredak</button></div>
  ${confirmReset?`<div class="confirm"><b>Brišu se ocjene, ciklusi, statistika i greške.</b><div class="row"><button class="btn" onclick="confirmReset=false;render()">Odustani</button><button class="btn p" onclick="S=blank();save();confirmReset=false;go('home')">Obriši</button></div></div>`:''}</div>`;
}
function exportS(){const b=new Blob([JSON.stringify({v:2,t:Date.now(),S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='drzavni-ispit-napredak-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
function importS(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const s=d.S||d;if(!Array.isArray(s.hist)||!s.st)throw 0;S=Object.assign(blank(),s);save();go('home')}catch(e){document.getElementById('impmsg').textContent='Datoteka nije ispravna sigurnosna kopija.'}};r.readAsText(f)}
function go(v){view=v;confirmReset=false;render();window.scrollTo(0,0)}
function render(){
  const tab=v=>({home:'home',exam:'home',res:'home',learn:'learn',learnQ:'learn',learnEnd:'learn',base:'base',set:'set'})[v];
  let h=`<nav class="tabs">${[['home','Ispit'],['learn','Učenje'],['base','Baza'],['set','Postavke']].map(([k,t])=>`<button class="${tab(view)===k?'on':''}" onclick="${k==='home'&&S.cur?"view='exam';render()":`go('${k}')`}">${t}</button>`).join('')}</nav>`;
  h+=view==='home'?(S.cur?`<div class="sheet"><b>Imaš nedovršen ispit (${S.cur.i+1}/${N}).</b><div class="row"><button class="btn p" onclick="view='exam';render()">Nastavi ispit</button></div></div>`:'')+home()
    :view==='exam'?exam():view==='res'?result():view==='learn'?learnHome():view==='learnQ'?learnQ():view==='learnEnd'?learnEnd():view==='base'?base():settings();
  document.getElementById('app').innerHTML=h;
}
if(S.cur)view='exam';
render();
</script>

</body></html>
